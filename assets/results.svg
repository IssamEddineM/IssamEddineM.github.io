<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-labelledby="t">
  <title id="t">Results: 100M+ records in one platform, 70% faster reporting cycles, 35+ QlikView apps governed</title>
    <rect x="1" y="1" width="998" height="218" rx="18" fill="#ffffff" stroke="#e8e5db" stroke-width="2"/>
  <line x1="340" y1="30" x2="340" y2="190" stroke="#e8e5db"/><line x1="670" y1="30" x2="670" y2="190" stroke="#e8e5db"/>
  <text x="36" y="78" font-family="'Bricolage Grotesque','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="54" font-weight="800" letter-spacing="-1" fill="#a87a0c">100M+</text>
  <text x="36" y="112" font-family="'Bricolage Grotesque','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#1b1a17">Records, one platform</text>
  <text x="36" y="136" font-family="'Hanken Grotesk','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#5b584f">Multi-subsidiary data consolidated after</text>
  <text x="36" y="155" font-family="'Hanken Grotesk','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#5b584f">an acquisition into a single group-level</text>
  <text x="36" y="174" font-family="'Hanken Grotesk','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#5b584f">BI platform (Fnac Darty).</text>

  <text x="372" y="78" font-family="'Bricolage Grotesque','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="54" font-weight="800" letter-spacing="-1" fill="#a87a0c">70%</text>
  <text x="372" y="112" font-family="'Bricolage Grotesque','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#1b1a17">Faster reporting cycles</text>
  <text x="372" y="136" font-family="'Hanken Grotesk','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#5b584f">Automated ETL pipelines and dashboards</text>
  <text x="372" y="155" font-family="'Hanken Grotesk','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#5b584f">replaced manual reporting</text>
  <text x="372" y="174" font-family="'Hanken Grotesk','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#5b584f">(Orange, ArcelorMittal).</text>

  <text x="702" y="78" font-family="'Bricolage Grotesque','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="54" font-weight="800" letter-spacing="-1" fill="#a87a0c">35+</text>
  <text x="702" y="112" font-family="'Bricolage Grotesque','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#1b1a17">QlikView apps governed</text>
  <text x="702" y="136" font-family="'Hanken Grotesk','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#5b584f">HR, products, sales, stocks and supply</text>
  <text x="702" y="155" font-family="'Hanken Grotesk','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#5b584f">chain, upgraded and administered by a</text>
  <text x="702" y="174" font-family="'Hanken Grotesk','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#5b584f">team I led (Sanofi).</text>

